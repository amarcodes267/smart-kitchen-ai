services:
  - type: web
    name: ai-kitchen
    runtime: python
    rootDir: AI-KITCHEN
    buildCommand: pip install -r ../requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-kitchen-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: ai-kitchen-db
    plan: free