<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping List | AI Kitchen</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
    <script src="{{ url_for('static', filename='js/kitchen.js') }}"></script>
    <style>
        .shopping-summary-bar {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 22px;
            padding: 14px 18px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            flex-wrap: wrap;
        }
        .summary-chip {
            padding: 4px 10px;
            border-radius: var(--radius-full);
            font-size: 0.8rem;
            font-weight: 600;
        }
        .summary-chip-buy {
            background: var(--danger-bg);
            color: #fca5a5;
            border: 1px solid var(--danger-border);
        }
        .summary-chip-reduce {
            background: var(--warning-bg);
            color: #fde047;
            border: 1px solid var(--warning-border);
        }
        .summary-chip-ok {
            background: var(--success-bg);
            color: #86efac;
            border: 1px solid var(--success-border);
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🍽️ AI Kitchen <span class="logo-tag">AI OS</span>
        </div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/kitchen-setup">Setup</a>
            <a href="/menu">Menu</a>
            <a href="/recipes">Recipes</a>
            <a href="/inventory">Inventory</a>
            <a href="/sales">Sales</a>
            <a href="/waste">Waste</a>
            <a href="/predictions">Predictions</a>
            <a href="/analytics">Analytics</a>
            <a href="/alerts">Alerts</a>
            <a href="/health-score">Health</a>
            <a href="/shopping" class="active">Shopping</a>
        </div>

    </nav>


    <main class="page-container">

        <div class="page-header">

            <span class="badge">
                Smart Shopping
            </span>

            <h1>
                Recommended Purchase List
            </h1>

            <p>
                AI-generated shopping list based on
                predicted demand and current inventory.
            </p>

        </div>


        <div id="shoppingContainer" class="loading">
            Loading...
        </div>

    </main>


    <script>

        let kitchenId = localStorage.getItem("kitchen_id");

        async function loadShoppingList() {
            if (!kitchenId && window.ensureKitchenId) {
                kitchenId = await window.ensureKitchenId();
            }
            if (!kitchenId) {
                document.getElementById('shoppingContainer').innerHTML = '<div class="empty-state">Please create a kitchen first.</div>';
                return;
            }

            try {
                const res = await fetch(`/api/shopping/kitchen/${kitchenId}`);
                const data = await res.json();
                if (!data.success) return;

                const list = data.shopping_list;
                const container = document.getElementById('shoppingContainer');

                if (!list.items || list.items.length === 0) {
                    container.innerHTML = '<div class="empty-state">No items to display.</div>';
                    return;
                }

                container.innerHTML = `
                    <div class="shopping-summary-bar">
                        <strong style="color: var(--heading); font-size: 0.9rem;">Procurement Plan:</strong>
                        <span class="summary-chip summary-chip-buy">${list.summary.to_buy} to buy</span>
                        <span class="summary-chip summary-chip-reduce">${list.summary.reduce_usage} reduce usage</span>
                        <span class="summary-chip summary-chip-ok">${list.summary.no_purchase} no purchase needed</span>
                    </div>
                    <div class="table-wrapper">
                        <table class="dashboard-table">
                            <thead>
                                <tr>
                                    <th>Ingredient</th>
                                    <th>Current</th>
                                    <th>Required</th>
                                    <th>Action</th>
                                    <th>Priority</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${list.items.map(i => {
                                    const prioBg = i.priority === 'high' ? 'var(--danger-bg)' : i.priority === 'medium' ? 'var(--warning-bg)' : i.priority === 'low' ? 'var(--info-bg)' : 'rgba(255,255,255,0.05)';
                                    const prioColor = i.priority === 'high' ? '#fca5a5' : i.priority === 'medium' ? '#fde047' : i.priority === 'low' ? '#7dd3fc' : '#94a3b8';
                                    const prioBorder = i.priority === 'high' ? 'var(--danger-border)' : i.priority === 'medium' ? 'var(--warning-border)' : i.priority === 'low' ? 'var(--info-border)' : 'var(--border)';
                                    return `
                                    <tr>
                                        <td style="font-weight: 600; color: var(--text-primary);">${i.ingredient}</td>
                                        <td>${i.current} ${i.unit}</td>
                                        <td>${i.required} ${i.unit}</td>
                                        <td>${i.action}</td>
                                        <td>
                                            <span style="
                                                font-size: 0.72rem;
                                                font-weight: 700;
                                                text-transform: uppercase;
                                                letter-spacing: 0.05em;
                                                padding: 3px 8px;
                                                border-radius: var(--radius-full);
                                                background: ${prioBg};
                                                color: ${prioColor};
                                                border: 1px solid ${prioBorder};
                                                display: inline-block;
                                            ">${i.priority}</span>
                                        </td>
                                    </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (error) {
                console.error('Shopping list error:', error);
            }
        }

        loadShoppingList();

    </script>

</body>
</html>
