<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Health Score | AI Kitchen</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <script src="{{ url_for('static', filename='js/kitchen.js') }}"></script>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🍽️ AI Kitchen
        </div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/alerts">Alerts</a>
        </div>

    </nav>


    <main class="page-container">

        <div class="page-header">

            <span class="badge">
                Kitchen Health
            </span>

            <h1>
                Kitchen Efficiency Score
            </h1>

            <p>
                A holistic view of your kitchen's
                performance across demand, waste,
                inventory, and cost.
            </p>

        </div>


        <div class="dashboard-grid">

            <div class="dashboard-card" style="text-align:center;">
                <div class="card-header">
                    <h2>
                        Overall Score
                    </h2>
                </div>
                <div style="height: 250px; display:flex;align-items:center;justify-content:center;">
                    <canvas id="healthGauge"></canvas>
                </div>
                <div id="healthStatus" style="margin-top:10px;">
                    Loading...
                </div>
            </div>

            <div class="dashboard-card">
                <div class="card-header">
                    <h2>
                        Score Breakdown
                    </h2>
                </div>
                <div id="healthBreakdown" class="loading">
                    Loading...
                </div>
            </div>

            <div class="dashboard-card full-width">
                <div class="card-header">
                    <h2>
                        Summary
                    </h2>
                </div>
                <div id="healthSummary" class="loading">
                    Loading...
                </div>
            </div>

        </div>

    </main>


    <script>

        const kitchenId = localStorage.getItem("kitchen_id");
        let kitchenId = localStorage.getItem("kitchen_id");

        async function loadHealthScore() {
            if (!kitchenId && window.ensureKitchenId) {
                kitchenId = await window.ensureKitchenId();
            }
            if (!kitchenId) return;

            try {
                const res = await fetch(`/api/health-score/kitchen/${kitchenId}`);
                const data = await res.json();
                if (!data.success) return;

                const hs = data.health_score;

                document.getElementById('healthStatus').innerHTML = `
                    <h1 style="font-size: 3rem; color: var(--primary-dark);">${hs.overall_score} / 100</h1>
                    <p style="font-size: 1.2rem; font-weight: 700;">${hs.health_emoji} ${hs.status}</p>
                    <p style="font-size: 1.2rem; font-weight: 700;">${hs.health_emoji || hs.emoji || '⚖️'} ${hs.status}</p>
                `;

                if (window.Chart) {
                    new Chart(document.getElementById('healthGauge'), {
                        type: 'doughnut',
                        data: {
                            labels: ['Score', 'Remaining'],
                            datasets: [{
                                data: [hs.overall_score, 100 - hs.overall_score],
                                backgroundColor: ['#2563EB', '#E5E7EB'],
                                borderWidth: 0,
                            }],
                        },
                        options: {
                            responsive: true,
                            cutout: '80%',
                            plugins: { legend: { display: false }, tooltip: { enabled: false } },
                        },
                    });
                }

                const components = hs.components;
                document.getElementById('healthBreakdown').innerHTML = Object.entries(components).map(([key, value]) => `
                    <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);">
                        <span style="text-transform:capitalize;">${key.replace('_', ' ')}</span>
                        <strong>${value}/100</strong>
                    </div>
                `).join('');

                const summary = hs.summary;
                document.getElementById('healthSummary').innerHTML = `
                    <div class="stats-grid" style="grid-template-columns: repeat(3, 1fr); gap: 15px;">
                        <div class="stat-card">
                            <span>Total Orders</span>
                            <strong>${summary.total_orders}</strong>
                        </div>
                        <div class="stat-card">
                            <span>Total Revenue</span>
                            <strong>₹${summary.total_revenue}</strong>
                        </div>
                        <div class="stat-card">
                            <span>Waste Cost</span>
                            <strong>₹${summary.waste_cost}</strong>
                        </div>
                        <div class="stat-card">
                            <span>Waste %</span>
                            <strong>${summary.waste_percentage}%</strong>
                        </div>
                        <div class="stat-card">
                            <span>Low Stock Items</span>
                            <strong>${summary.low_stock_items}</strong>
                        </div>
                        <div class="stat-card">
                            <span>Inventory Items</span>
                            <strong>${summary.inventory_items}</strong>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Health score error:', error);
            }
        }

        loadHealthScore();

    </script>

</body>
</html>
